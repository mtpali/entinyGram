name: VPN963 upstream integration diagnostics

on:
  push:
    branches: [vpn963-v13.0.2]
    paths:
      - '.github/workflows/vpn963-upstream-merge-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-probe:
    name: Inspect v13.0.2 upstream merge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch verified upstream release
        run: |
          git fetch --no-tags https://github.com/entaytion/entinyGram.git \\
            refs/tags/v12.10.6-202610040:refs/tags/vpn963-upstream-old \\
            refs/tags/v13.0.2-202610160:refs/tags/vpn963-upstream-new
          test "$(git rev-parse refs/tags/vpn963-upstream-old)" = 77b9c206998cc4bdaf8d24cc55ae312daf426c24
          test "$(git rev-parse refs/tags/vpn963-upstream-new)" = ce6a86fac193cbec5d3122e1ef9e5006e53a9d4c
          root=$(git rev-list --max-parents=0 HEAD | head -1)
          test -n "$root"
          git replace --graft "$root" refs/tags/vpn963-upstream-old
          test "$(git merge-base HEAD refs/tags/vpn963-upstream-new)" = 77b9c206998cc4bdaf8d24cc55ae312daf426c24
      - name: Analyze merge without committing or pushing
        run: |
          set -uo pipefail
          git config user.name 'mtpali migration probe'
          git config user.email '316823762+mtpali@users.noreply.github.com'
          {
            echo '=== Common ancestor ==='
            git merge-base HEAD refs/tags/vpn963-upstream-new || true
            echo '=== Upstream and fork commits since ancestor ==='
            git rev-list --left-right --count HEAD...FETCH_HEAD || true
            echo '=== Merge attempt ==='
            result=0
            git merge --no-commit --no-ff refs/tags/vpn963-upstream-new || result=$?
            echo "Merge exit code: $result"
            echo '=== Conflicting files ==='
            git diff --name-only --diff-filter=U | head -200 || true
            echo 'Total unresolved paths:'
            git diff --name-only --diff-filter=U | wc -l || true
            echo '=== Conflict statuses ==='
            git status --short | grep -E '^(AA|AU|UA|DD|DU|UD|UU)' | head -200 || true
            echo '=== File status summary ==='
            git status --short | awk '{print $1}' | sort | uniq -c | sort -nr | head -30
            echo '=== Critical migration paths ==='
            git status --short | grep -E 'src/(kotlin|fork)|patches/entiny|series|upstream-commit|scripts/|\.github/' | head -200 || true
          } > integration-report.txt 2>&1
          cat integration-report.txt
      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpn963-v13-upstream-merge-report
          path: integration-report.txt
          if-no-files-found: error
          retention-days: 30
