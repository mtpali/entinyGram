name: VPN963 v13.0.2 migration probe

on:
  push:
    branches: [vpn963-v13.0.2]
    paths:
      - '.github/workflows/vpn963-migration-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-rebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install StGit
        run: |
          curl -fsSL --retry 3 -o /tmp/stgit.deb https://github.com/stacked-git/stgit/releases/download/v2.7.0/stgit_2.7.0-1_amd64.deb
          sudo apt-get install -y /tmp/stgit.deb
          stg --version
          stg import --help | grep -q -- '--3way'
      - name: Configure Git
        run: |
          git config --global user.name 'mtpali migration probe'
          git config --global user.email '316823762+mtpali@users.noreply.github.com'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Materialize current VPN963 stack
        run: bun run setup
      - name: Inspect and clean generated worktree drift before StGit rebase
        run: |
          git -C worktree status --short | head -100 || true
          git -C worktree diff --stat | head -100 || true
          git -C worktree diff -- TMessagesProj/src/main/res/values-night/styles.xml | head -100 || true
          python3 - <<'PY'
          import subprocess
          entries = subprocess.check_output(['git', '-C', 'worktree', 'ls-files', '-v', '-z']).split(b'\0')
          skipped = [entry[2:].decode() for entry in entries if entry.startswith(b'S ')]
          print(f'Restoring {len(skipped)} skip-worktree paths in ephemeral CI checkout')
          for start in range(0, len(skipped), 200):
              subprocess.run(['git', '-C', 'worktree', 'update-index', '--no-skip-worktree', '--', *skipped[start:start + 200]], check=True)
          PY
          git -C worktree reset --hard HEAD
          test -z "$(git -C worktree status --porcelain --untracked-files=no)"
      - name: Test native Telegram rebase (no remote writes)
        id: rebase
        continue-on-error: true
        run: |
          set -o pipefail
          bun run rebase f32ffeec763f0bdbf4bec25b52d654f77bff733d 2>&1 | tee migration-rebase.log
      - name: Capture StGit state and conflicts
        if: always()
        run: |
          {
            echo '=== Rebase outcome ==='
            echo '${{ steps.rebase.outcome }}'
            echo '=== Worktree status ==='
            git -C worktree status --short || true
            echo '=== StGit top ==='
            stg -C worktree top || true
            echo '=== StGit series ==='
            stg -C worktree series || true
            echo '=== Unmerged files ==='
            git -C worktree diff --name-only --diff-filter=U || true
          } > migration-state.log 2>&1
          echo '=== Rebase conflict summary ==='
          head -60 migration-state.log
          echo '=== First conflicting file context ==='
          while IFS= read -r path; do
            echo "FILE: $path"
            grep -n -A 12 -B 12 -E '^(<<<<<<<|=======|>>>>>>>)' "worktree/$path" | head -180 || true
          done < <(git -C worktree diff --name-only --diff-filter=U | head -3)
      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpn963-v13-migration-diagnostics
          path: |
            migration-rebase.log
            migration-state.log
          if-no-files-found: warn
          retention-days: 30
      - name: Mark unresolved migration as failed
        if: steps.rebase.outcome != 'success'
        run: exit 1
